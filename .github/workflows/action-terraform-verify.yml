name: Terraform Verification

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  id-token: write
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    name: Terraform fmt check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch changed files
        id: pr_files
        uses: jitterbit/get-changed-files@v1
        with:
          format: "space-delimited"

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.2.4

      - name: Validate Terraform formatting
        run: |
          CHECK_STATUS=0

          for changed_file in ${{ steps.pr_files.outputs.added_modified }}; do
            echo "Checking Terraform formatting on ${changed_file}..."

            if [[ "$changed_file" == *.tf ]]; then
              terraform fmt -check "$changed_file"
              FMT_STATUS=$?

              if [[ $FMT_STATUS -ne 0 ]]; then
                echo "❌ terraform fmt failed - ${changed_file}" >> "$GITHUB_STEP_SUMMARY"
                CHECK_STATUS=1
              else
                echo "✅ terraform fmt passed - ${changed_file}" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done

          exit "$CHECK_STATUS"

  validate:
    runs-on: ubuntu-latest
    name: Terraform validate

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.2.4

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate -no-color