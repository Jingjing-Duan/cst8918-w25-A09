name: Terraform Verification

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    name: Terraform fmt check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.2.4

      - name: Validate Terraform formatting
        shell: bash
        run: |
          CHECK_STATUS=0

          CHANGED_FILES=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")

          echo "Changed files:"
          echo "$CHANGED_FILES"

          for changed_file in $CHANGED_FILES; do
            if [[ "$changed_file" == *.tf ]]; then
              echo "Checking Terraform formatting on ${changed_file}..."

              if ! terraform fmt -check "$changed_file"; then
                echo "❌ terraform fmt failed - ${changed_file}" >> "$GITHUB_STEP_SUMMARY"
                CHECK_STATUS=1
              else
                echo "✅ terraform fmt passed - ${changed_file}" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done

          exit "$CHECK_STATUS"

  validate:
    runs-on: ubuntu-latest
    name: Terraform validate

    defaults:
      run:
        working-directory: infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.2.4

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate -no-color